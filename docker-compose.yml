services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unichat_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://unichat_user:unichat_password@postgres:5432/unichat_db?schema=public
      PORT: 5000
      CORS_ORIGIN: http://localhost:5000
      SESSION_DURATION_DAYS: 7
      SALT_ROUNDS: 12
      SESSION_TOKEN_PEPPER: replace-with-a-long-random-secret
      ADMIN_SETUP_CODE: replace-with-admin-code
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  postgres:
    image: postgres:15-alpine
    container_name: unichat_db
    restart: always
    environment:
      POSTGRES_USER: unichat_user
      POSTGRES_PASSWORD: unichat_password
      POSTGRES_DB: unichat_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unichat_user -d unichat_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_uploads:
